[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sentinelwp-ai"
version = "0.1.1"
description = "Read-only offline WordPress source security review"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "eligeunaweb"}]
[project.scripts]
sentinelwp = "sentinelwp.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
